# Publica la web en GitHub Pages. Cada hora (minuto 25, después de recoger, agrupar y calcular temas) genera
# las páginas de cada noticia y cada tema, las imágenes para redes y el mapa del sitio (ver seo/generar.py).
name: Publicar la web
on:
  push:
    branches: [main]
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow fonttools brotli
      - run: python seo/generar.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
